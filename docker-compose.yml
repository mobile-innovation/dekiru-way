# ローカル開発用インフラ: PostgreSQL
# 使い方: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: dekiru-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dekiru
      POSTGRES_PASSWORD: dekiru
      POSTGRES_DB: dekiru
    ports:
      # ホスト側 5433 (5432 は他プロジェクトが使用中のことがあるため)
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekiru -d dekiru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
